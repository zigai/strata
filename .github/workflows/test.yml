name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Every module is checked, not just the root: the workspace here has four.
      - run: just mod-check
      - run: just test
