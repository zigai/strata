<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" role="img" aria-labelledby="title description">
  <title id="title">Strata gopher</title>
  <desc id="description">A Go gopher in an ochre geologist's helmet cradles a chipped rock specimen. Six sedimentary layers continue across its exposed front and side, illustrating ordered configuration layers.</desc>
  <metadata>
    Strata mascot, adapted in 2026 from the Go gopher by Renée French.
    Original character: https://go.dev/blog/gopher
    Artwork license: CC BY 4.0, https://creativecommons.org/licenses/by/4.0/
    Adaptation: original character curves retained; paws repositioned to hold a
    six-layer rock specimen; geologist's helmet, rock faces, and mineral details added.
  </metadata>

