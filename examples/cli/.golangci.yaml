# The example is written to be read by people evaluating strata, so it uses
# golangci-lint's standard set instead of the library's strict configuration.
version: "2"

formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    gofumpt:
      extra:
        balance-calls: true
    golines:
      max-len: 100
      reformat-tags: false
    goimports:
      local-prefixes:
        - github.com/zigai/strata
  exclusions:
    paths:

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Table rows are buffered by tabwriter, whose Flush reports write errors.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: "(?:(^|/)(node_modules|third_party|forks|vendor|testdata|fixtures|__fixtures__|snapshots|__snapshots__|__image_snapshots__|golden|corpus|fuzz_corpus|baselines|generated|\\.tmp|\\.gameops|\\.stryker-tmp|\\.cache)(/|$))"
        linters: [whitespace]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
