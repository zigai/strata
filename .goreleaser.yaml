version: 2
project_name: "strata"

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: strata
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zigai/strata/internal/cli.version={{.Version}}
      - -X github.com/zigai/strata/internal/cli.commit={{.ShortCommit}}
      - -X github.com/zigai/strata/internal/cli.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:

      - README.md

nfpms:
  - id: "strata"
    package_name: "strata"
    vendor: "zigai"
    homepage: "https://github.com/zigai/strata"
    maintainer: "zigai"
    description: "Layered, multi-format configuration library for Go with XDG cascading, provenance tracking, and CLI bridges"
    license: "Proprietary"
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: desc
  abbrev: 7

  format: '[`{{ printf "%.7s" .SHA }}`](https://github.com/zigai/strata/commit/{{ .SHA }}) {{ .Message }}'

  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]+\))?!?:'
      - '^test(\([^)]+\))?!?:'
      - '^ci(\([^)]+\))?!?:'
      - '^chore(\([^)]+\))?!?:'


release:
  github:
    owner: "zigai"
    name: "strata"
  draft: false
  prerelease: auto

